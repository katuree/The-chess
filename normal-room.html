<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Normal Chess Room - The Chess</title><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;color:#f5f7ff;background:radial-gradient(circle at top,#1b3159 0%,#111a31 48%,#081020 100%);display:grid;place-items:center;padding:24px}.panel{width:min(620px,100%);padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.05));box-shadow:0 24px 75px rgba(0,0,0,.42);display:grid;gap:14px;text-align:center}.top-nav{margin-bottom:4px}.top-nav a{color:#ffe45c;text-decoration:none;font-weight:900}.btn{border:0;border-radius:16px;padding:18px 20px;color:#fff;cursor:pointer;text-align:center;font-size:1.12rem;font-weight:900;background:linear-gradient(135deg,#376eff,#1944b8);text-decoration:none}.btn.host{background:linear-gradient(135deg,#16b984,#08735f)}.btn.quick{background:linear-gradient(135deg,#f6b343,#b56713)}input{width:100%;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:14px 16px;background:#101a33;color:#fff;font-weight:800}.status{min-height:44px;padding:10px;border-radius:10px;background:rgba(0,0,0,.28);line-height:1.45;color:#dce6ff}.row{display:grid;grid-template-columns:1fr auto;gap:10px}</style></head><body><main class="panel"><nav class="top-nav"><a href="./normal-chess.html">← Normal Chess</a></nav><h1>Room</h1><button id="normal-room-host-btn" class="btn host" type="button">Host Room</button><div class="row"><input id="normal-room-code-input" placeholder="Paste room code" autocomplete="off"/><button id="normal-room-join-btn" class="btn" type="button">Join</button></div><div id="normal-room-status" class="status">Host a private normal chess room or join with a room code.</div></main><script>(()=>{const input=document.getElementById('normal-room-code-input');const status=document.getElementById('normal-room-status');function code(){return `normalchess-${Math.random().toString(36).slice(2,8)}`;}function go(role,room){location.href=`./normal-chess.html?online=${role}&room=${encodeURIComponent(room)}`;}document.getElementById('normal-room-host-btn').addEventListener('click',()=>{const room=code(); status.textContent=`Creating room ${room}...`; go('host',room);});document.getElementById('normal-room-join-btn').addEventListener('click',()=>{const room=input.value.trim(); if(!room){status.textContent='Enter a room code first.';return;} go('guest',room);});})();</script></body></html>
