<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normal Chess Quick Match - The Chess</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;color:#f5f7ff;background:radial-gradient(circle at top,#1b3159 0%,#111a31 48%,#081020 100%);display:grid;place-items:center;padding:24px}
    .panel{width:min(620px,100%);padding:28px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.05));box-shadow:0 24px 75px rgba(0,0,0,.42);display:grid;gap:14px;text-align:center}
    .top-nav{margin-bottom:4px}.top-nav a{color:#ffe45c;text-decoration:none;font-weight:900}
    .btn{border:0;border-radius:16px;padding:18px 20px;color:#fff;cursor:pointer;text-align:center;font-size:1.12rem;font-weight:900;background:linear-gradient(135deg,#f6b343,#b56713);text-decoration:none}.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}
    .status{min-height:48px;padding:12px;border-radius:10px;background:rgba(0,0,0,.28);line-height:1.45;color:#dce6ff}
  </style>
</head>
<body>
  <main class="panel">
    <nav class="top-nav"><a href="./normal-chess.html">← Normal Chess</a></nav>
    <h1>Quick Match</h1>
    <div id="normal-quick-status" class="status">Finding players...</div>
    <button id="normal-quick-start-btn" class="btn" type="button">Find Players</button>
  </main>
  <script>
  (()=>{
    const PEERJS_CDN='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';
    const QUICK_ROOM='thechess-normal-quick-match';
    const status=document.getElementById('normal-quick-status');
    const startBtn=document.getElementById('normal-quick-start-btn');
    let peer=null, conn=null, started=false;
    function setStatus(text){ status.textContent=text; }
    function gameUrl(role){ return `./normal-chess.html?online=${role}&room=${encodeURIComponent(QUICK_ROOM)}`; }
    function loadPeerJs(){ if(window.Peer) return Promise.resolve(); return new Promise((resolve,reject)=>{ const script=document.createElement('script'); script.src=PEERJS_CDN; script.onload=resolve; script.onerror=()=>reject(new Error('PeerJS failed to load')); document.head.appendChild(script); }); }
    function begin(role){ if(started) return; started=true; setStatus('Player found. Starting match...'); setTimeout(()=>{ location.href=gameUrl(role); },300); }
    async function findPlayers(){
      startBtn.disabled=true;
      setStatus('Finding players... waiting for another player.');
      await loadPeerJs();
      peer=new Peer(QUICK_ROOM);
      peer.on('open',()=>setStatus('Waiting for another player...'));
      peer.on('connection',c=>{ conn=c; conn.on('open',()=>{ conn.send({type:'start'}); begin('host'); }); conn.on('close',()=>{ if(!started) setStatus('Player disconnected. Waiting for another player...'); }); });
      peer.on('error',err=>{
        if(err.type==='unavailable-id') joinExistingQuickMatch();
        else { startBtn.disabled=false; setStatus(`Quick match error: ${err.type||err.message}`); }
      });
    }
    async function joinExistingQuickMatch(){
      setStatus('Match found. Connecting...');
      peer=new Peer();
      peer.on('open',()=>{ conn=peer.connect(QUICK_ROOM,{reliable:true}); conn.on('open',()=>setStatus('Connected. Waiting for host to start...')); conn.on('data',msg=>{ if(msg?.type==='start') begin('guest'); }); conn.on('close',()=>{ if(!started){ setStatus('Host disconnected. Try again.'); startBtn.disabled=false; } }); });
      peer.on('error',err=>{ startBtn.disabled=false; setStatus(`Quick match error: ${err.type||err.message}`); });
    }
    startBtn.addEventListener('click',findPlayers);
    findPlayers();
  })();
  </script>
</body>
</html>
