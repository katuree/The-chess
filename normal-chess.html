      border-radius:12px;

      background:#f0d9b5;

    .light { background:#f0d9b5; }
    .dark { background:#b58863; }
    .square::before {

      top:4px;
      font-size:.68rem;
      font-weight:900;
      color:rgba(60,38,21,.46);
      z-index:0;

    .section h3 { color:#ffe45c; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,.14); }

    .move-log,.captured { min-height:70px; max-height:240px; overflow-y:auto; font-family:Consolas,monospace; line-height:1.7; }
    .btn { border:0; border-radius:10px; padding:12px 16px; color:#fff; font-weight:900; cursor:pointer; background:linear-gradient(135deg,#376eff,#1944b8); }

    .room-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

    function tone(f,d=.08,type='sine'){ const ctx=unlockAudio(); if(!ctx) return; const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.05,ctx.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d); o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+d+.03); }
    function playSound(kind='move'){ if(!soundEnabled) return; if(kind==='capture'){tone(250,.1,'square'); setTimeout(()=>tone(170,.12,'triangle'),70);} else if(kind==='check'){tone(640,.1,'sawtooth'); setTimeout(()=>tone(780,.11,'sawtooth'),90);} else tone(380,.075,'sine'); }
    function render(){ const board=document.getElementById('normal-board'); board.innerHTML=''; for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const sq=document.createElement('div'); sq.className=`square ${(r+c)%2?'dark':'light'}`; sq.dataset.label=(c===0?8-r:'')+(r===7?'abcdefgh'[c]:''); const p=game.piece(r,c); if(p){ const span=document.createElement('span'); span.className=`chess-piece piece-${p.player} piece-${p.type}`; span.innerHTML=iconFor(p.type); span.title=`${p.player} ${p.type}`; sq.appendChild(span); } if(game.selected&&game.selected[0]===r&&game.selected[1]===c) sq.classList.add('selected'); if(game.targets.some(([tr,tc])=>tr===r&&tc===c)) sq.classList.add(game.piece(r,c)?'capture':'target'); if(game.lastMove&&(game.lastMove.from[0]===r&&game.lastMove.from[1]===c||game.lastMove.to[0]===r&&game.lastMove.to[1]===c)) sq.classList.add('last'); if(p&&p.type==='king'&&game.checkPlayer===p.player) sq.classList.add('check'); sq.addEventListener('click',()=>clickSquare(r,c)); board.appendChild(sq); }
      const name=document.getElementById('current-player-name'); name.textContent=cap(game.current); name.className=game.current; document.getElementById('turn-counter').textContent=`Move: ${Math.floor(game.turn/2)+1}`; document.getElementById('captured-pieces').innerHTML=game.captured.map(p=>`<span class="chess-piece piece-${p.player}" style="display:inline-grid;width:28px;height:28px" title="${p.player} ${p.type}">${iconFor(p.type)}</span>`).join(''); document.getElementById('move-log').innerHTML=game.log.map((m,i)=>`<div>${i+1}. ${cap(m.player)} ${m.text}</div>`).join(''); updateNormalRoomUi(); document.getElementById('game-status').textContent=game.gameOver?`Checkmate! ${cap(game.current==='white'?'black':'white')} wins.`:game.checkPlayer?`Check! ${cap(game.checkPlayer)} king is under attack.${normalMode==='single'?' You are White; AI is Black.':''}${normalNetworkRole!=='offline'?' Online room active.':''}`:`Game in progress...${normalMode==='single'?' You are White; AI is Black.':''}${normalNetworkRole!=='offline'?' Online room active.':''}`; document.getElementById('undo-btn').disabled=!(game.undoStack&&game.undoStack.length)||aiThinking; document.getElementById('sound-btn').textContent=soundEnabled?'Sound: On':'Sound: Off'; scheduleNormalAiTurn(); }
    function clickSquare(r,c){ unlockAudio(); if(game.gameOver||aiThinking||isNormalAiTurn()) return; const p=game.piece(r,c); if(game.selected){ const [sr,sc]=game.selected; if(game.targets.some(([tr,tc])=>tr===r&&tc===c)){ if(normalNetworkRole==='guest'){ sendNormalMoveRequest(sr,sc,r,c); game.selected=null; game.targets=[]; render(); return; } const moved=game.move(sr,sc,r,c); if(moved) broadcastNormalState(); game.selected=null; game.targets=[]; render(); return; } game.selected=null; game.targets=[]; } if(p&&p.player===game.current){ game.selected=[r,c]; game.targets=game.moves(r,c); } render(); }
    function isNormalAiTurn(){ return normalMode==='single' && game.current==='black' && !game.gameOver; }
    function chooseNormalAiMove(){
      const moves=game.legalMovesFor('black');
      if(!moves.length) return null;
      let best=-Infinity, bestMoves=[];
      for(const move of moves){
        const [tr,tc]=move.to;
        const captured=game.piece(tr,tc);
        const center=Math.abs(tr-3.5)+Math.abs(tc-3.5);
        let score=(captured?PIECE_VALUES[captured.type]||0:0)-center+Math.random()*6;
        if(score>best){ best=score; bestMoves=[move]; }
        else if(Math.abs(score-best)<.001) bestMoves.push(move);
      }
      return bestMoves[Math.floor(Math.random()*bestMoves.length)];
    }
    function performNormalAiTurn(){
      if(!isNormalAiTurn()){ aiThinking=false; return; }
      const move=chooseNormalAiMove();
      aiThinking=false;
      if(move){ game.move(move.from[0],move.from[1],move.to[0],move.to[1]); broadcastNormalState(); }
      render();
    }
    function scheduleNormalAiTurn(){
      if(!isNormalAiTurn()||aiThinking) return;
      aiThinking=true;
      setTimeout(performNormalAiTurn,NORMAL_AI_DELAY);
    }
    function serializeNormalGame(){ return {board:game.board, turn:game.turn, log:game.log, captured:game.captured, lastMove:game.lastMove, gameOver:game.gameOver, checkPlayer:game.checkPlayer}; }
    function applyNormalRemoteState(state){ if(!state) return; game.board=state.board; game.turn=state.turn; game.log=state.log||[]; game.captured=state.captured||[]; game.lastMove=state.lastMove||null; game.gameOver=!!state.gameOver; game.checkPlayer=state.checkPlayer||null; game.selected=null; game.targets=[]; aiThinking=false; render(); }
    function updateNormalRoomUi(){ const status=document.getElementById('normal-room-status'), code=document.getElementById('normal-room-code'); if(!status||!code) return; const peers=normalHostConnections.filter(c=>c.open).length; code.textContent=normalRoomId?`Room: ${normalRoomId}`:''; status.textContent=normalNetworkRole==='host'?`Hosting room. Players connected: ${peers}`:normalNetworkRole==='guest'?`Joined room ${normalRoomId||''}`:'Offline'; document.getElementById('normal-copy-room-btn').disabled=!normalRoomId; document.getElementById('normal-leave-room-btn').disabled=normalNetworkRole==='offline'; }
    function makeNormalRoomCode(){ return `normalchess-${Math.random().toString(36).slice(2,8)}`; }
    function loadNormalPeerJs(){ if(window.Peer) return Promise.resolve(); return new Promise((resolve,reject)=>{ const existing=document.querySelector('script[data-peerjs]'); if(existing){ existing.addEventListener('load',resolve,{once:true}); existing.addEventListener('error',reject,{once:true}); return; } const script=document.createElement('script'); script.src=NORMAL_PEERJS_CDN; script.dataset.peerjs='true'; script.onload=resolve; script.onerror=()=>reject(new Error('PeerJS failed to load')); document.head.appendChild(script); }); }
    function connectNormalHostConn(conn){ normalHostConnections.push(conn); conn.on('open',()=>{ conn.send({type:'state', state:serializeNormalGame()}); updateNormalRoomUi(); }); conn.on('data',msg=>{ if(msg?.type==='move'){ const ok=game.move(msg.fr,msg.fc,msg.tr,msg.tc); if(ok){ render(); broadcastNormalState(); } } }); conn.on('close',()=>{ normalHostConnections=normalHostConnections.filter(c=>c!==conn); updateNormalRoomUi(); }); }
    function broadcastNormalState(){ if(normalNetworkRole!=='host') return; const packet={type:'state', state:serializeNormalGame()}; for(const conn of normalHostConnections.filter(c=>c.open)) conn.send(packet); updateNormalRoomUi(); }
    function sendNormalMoveRequest(fr,fc,tr,tc){ if(normalNetworkRole==='guest' && normalRoomConn?.open) normalRoomConn.send({type:'move',fr,fc,tr,tc}); }
    async function hostNormalRoom(code=null, copyInvite=true){ await loadNormalPeerJs(); leaveNormalRoom(false); normalRoomId=code||makeNormalRoomCode(); normalNetworkRole='host'; normalRoomPeer=new Peer(normalRoomId); normalRoomPeer.on('open',()=>{ updateNormalRoomUi(); if(copyInvite) copyNormalRoomInvite(); }); normalRoomPeer.on('connection',connectNormalHostConn); normalRoomPeer.on('error',err=>{ document.getElementById('normal-room-status').textContent=`Room error: ${err.type||err.message}`; }); updateNormalRoomUi(); }
    async function joinNormalRoom(code=null){ await loadNormalPeerJs(); leaveNormalRoom(false); normalRoomId=(code||document.getElementById('normal-join-room-code').value||new URLSearchParams(location.search).get('normalRoom')||new URLSearchParams(location.search).get('room')||'').trim(); if(!normalRoomId){ document.getElementById('normal-room-status').textContent='Enter a room code first.'; return; } normalNetworkRole='guest'; normalRoomPeer=new Peer(); normalRoomPeer.on('open',()=>{ normalRoomConn=normalRoomPeer.connect(normalRoomId,{reliable:true}); normalRoomConn.on('open',updateNormalRoomUi); normalRoomConn.on('data',msg=>{ if(msg?.type==='state') applyNormalRemoteState(msg.state); }); normalRoomConn.on('close',()=>{ normalNetworkRole='offline'; updateNormalRoomUi(); }); }); normalRoomPeer.on('error',err=>{ document.getElementById('normal-room-status').textContent=`Room error: ${err.type||err.message}`; }); updateNormalRoomUi(); }
    async function quickNormalMatch(){ document.getElementById('normal-room-status').textContent='Quick match: looking for players...'; await loadNormalPeerJs(); leaveNormalRoom(false); normalRoomId=NORMAL_QUICK_MATCH_ROOM; normalNetworkRole='host'; normalRoomPeer=new Peer(NORMAL_QUICK_MATCH_ROOM); normalRoomPeer.on('open',()=>{ document.getElementById('normal-room-status').textContent='Quick match: waiting for another player...'; updateNormalRoomUi(); }); normalRoomPeer.on('connection',connectNormalHostConn); normalRoomPeer.on('error',err=>{ if(err.type==='unavailable-id') joinNormalRoom(NORMAL_QUICK_MATCH_ROOM); else document.getElementById('normal-room-status').textContent=`Quick match error: ${err.type||err.message}`; }); updateNormalRoomUi(); }
    function copyNormalRoomInvite(){ if(!normalRoomId) return; const url=new URL(location.href); url.searchParams.set('normalRoom',normalRoomId); navigator.clipboard?.writeText(url.toString()); document.getElementById('normal-room-status').textContent=`Invite copied: ${normalRoomId}`; }
    function leaveNormalRoom(renderAfter=true){ for(const conn of normalHostConnections) conn.close?.(); normalHostConnections=[]; normalRoomConn?.close?.(); normalRoomConn=null; normalRoomPeer?.destroy?.(); normalRoomPeer=null; normalNetworkRole='offline'; normalRoomId=''; if(renderAfter) render(); else updateNormalRoomUi(); }
    function startNormalGame(mode){
      normalMode=mode;
      aiThinking=false;
      game.newGame();
      document.getElementById('normal-mode-menu').classList.add('hidden');
      document.getElementById('normal-game-screen').classList.remove('hidden');
      render();
      if(mode==='quick') quickNormalMatch();
      if(mode==='room') hostNormalRoom();
    }
    function showNormalModeMenu(e){
      e?.preventDefault();
      aiThinking=false;
      normalMode=null;
      document.getElementById('normal-game-screen').classList.add('hidden');
      document.getElementById('normal-mode-menu').classList.remove('hidden');
    }
    document.getElementById('normal-player-vs-ai-btn').addEventListener('click',()=>startNormalGame('single'));
    document.getElementById('normal-local-pvp-btn').addEventListener('click',()=>startNormalGame('multi'));
    document.getElementById('normal-quick-match-btn').addEventListener('click',()=>startNormalGame('quick'));
    document.getElementById('normal-room-btn').addEventListener('click',()=>startNormalGame('room'));
    document.getElementById('change-mode-link').addEventListener('click',showNormalModeMenu);
    document.getElementById('new-game-btn').addEventListener('click',()=>{ game.newGame(); broadcastNormalState(); render(); });
    document.getElementById('undo-btn').addEventListener('click',()=>{ game.undo(); broadcastNormalState(); render(); });
    document.getElementById('normal-host-room-btn').addEventListener('click',()=>hostNormalRoom());
    document.getElementById('normal-join-room-btn').addEventListener('click',()=>joinNormalRoom());
    document.getElementById('normal-copy-room-btn').addEventListener('click',copyNormalRoomInvite);
    document.getElementById('normal-leave-room-btn').addEventListener('click',()=>leaveNormalRoom());
    document.getElementById('sound-btn').addEventListener('click',()=>{ soundEnabled=!soundEnabled; if(soundEnabled){ unlockAudio(); playSound('move'); } render(); });
    document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='u'){game.undo();render();} if(e.key.toLowerCase()==='n'){game.newGame();render();} });
    render(); const inviteNormalRoom = new URLSearchParams(location.search).get('normalRoom') || new URLSearchParams(location.search).get('room'); if(inviteNormalRoom){ startNormalGame('multi'); document.getElementById('normal-join-room-code').value=inviteNormalRoom; joinNormalRoom(inviteNormalRoom); } console.log('[Normal Chess] boot ok',{squares:document.querySelectorAll('.square').length,pieces:Array.from(document.querySelectorAll('.chess-piece')).length});
  })();
  </script>
